<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Systems Manager demo</title>
<meta name="description" content="Try LLM Systems Manager in your browser with sample data: watch llama.cpp, vLLM and LM Studio machines, models, alerts and energy use from one dashboard.">
<link rel="canonical" href="https://demo.llmsyscore.com/">
<link rel="icon" type="image/png" href="https://www.llmsyscore.com/assets/favicon-32.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LLM SysCore">
<meta property="og:title" content="LLM Systems Manager demo">
<meta property="og:description" content="Try the dashboard in your browser with sample data. No install needed.">
<meta property="og:url" content="https://demo.llmsyscore.com/">
<meta property="og:image" content="https://www.llmsyscore.com/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.llmsyscore.com/assets/og-card.png">
<script src="/demo/demo-analytics.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0e1f;color:#dfe6ff;font-family:system-ui,sans-serif}
main{text-align:center}
h1{font-size:1.25rem;font-weight:600;margin:0 0 .75rem}
#demoNotice,#demoSlow{display:none;max-width:30rem;padding:1.5rem;line-height:1.5}
#demoNotice a,#demoSlow a{color:#5b7cfa}
#demoLoading{opacity:.7}
</style>
</head>
<body>
<main>
<h1>LLM Systems Manager demo</h1>
<div id="demoLoading">Loading the demo...</div>
<div id="demoSlow">
  <p>Still loading the demo... If it does not open, see the <a href="https://www.llmsyscore.com/#screenshots">screenshots</a> or <a href="https://get.llmsyscore.com/?ref=demo">install it on your own machine</a>.</p>
</div>
<div id="demoNotice">
  <p>This demo needs a browser that supports service workers. See the <a href="https://www.llmsyscore.com/#screenshots">screenshots</a> or <a href="https://get.llmsyscore.com/?ref=demo">install it on your own machine</a>.</p>
</div>
</main>
<script>
(function () {
  var done = false;
  var failed = false;
  function go() {
    if (done) return;
    done = true;
    if (window.DemoLanding) window.DemoLanding('open');
    location.replace('/dashboard');
  }
  function show(id, reason) {
    if (done) return;
    ['demoLoading', 'demoSlow', 'demoNotice'].forEach(function (n) {
      document.getElementById(n).style.display = n === id ? 'block' : 'none';
    });
    if (window.DemoLanding) window.DemoLanding(reason);
  }
  function fail(reason) { failed = true; show('demoNotice', reason); }
  if (/bot[\/;)-]|bot$|crawl|spider|slurp|Google-InspectionTool|GoogleOther/i.test(navigator.userAgent)) {
    ['demoLoading', 'demoSlow'].forEach(function (n) { document.getElementById(n).style.display = n === 'demoSlow' ? 'block' : 'none'; });
    return;
  }
  if (!('serviceWorker' in navigator)) { fail('unsupported'); return; }
  if (navigator.serviceWorker.controller) { go(); return; }
  navigator.serviceWorker.addEventListener('controllerchange', go);
  setTimeout(function () { if (!failed && !navigator.serviceWorker.controller) show('demoSlow', 'slow'); }, 10000);
  navigator.serviceWorker.register('/demo-sw.js', { scope: '/' }).then(function () {
    if (navigator.serviceWorker.controller) go();
  }, function () { fail('failed'); });
})();
</script>
</body>
</html>
