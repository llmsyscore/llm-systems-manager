# Monthly, grouped dependency bumps so runtime/action majors can't drift for a
# year again (#701). One PR per ecosystem at most; tune or drop as needed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /llm-systems-manager/backend
      - /llm-systems-manager
      - /llm-systems-alarm-engine
      - /agent/install
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /llm-systems-manager/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      frontend-dev:
        patterns: ["*"]
