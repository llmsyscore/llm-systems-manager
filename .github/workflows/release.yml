name: Release

# On every v* tag push: build the source tarball, run the brew control-plane
# e2e against that BUILT tarball plus the compose smoke/upgrade (docker.yml via
# workflow_call), and only then publish the GitHub Release + packages + ghcr
# images. A build that fails either gate never becomes a published release
# (#445, #701). workflow_dispatch (input: ref) runs build + both gates against
# an existing tag WITHOUT publishing — a zero-clutter dry-run. Dispatch it FROM
# that tag ("Use workflow from") so the compose gate checks out the same ref.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag to build + brew-verify (dry-run, no publish)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.ref || github.ref_name }}

jobs:
  build:
    name: build tarball + checksum
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      manager_version: ${{ steps.versions.outputs.manager }}
      ae_version: ${{ steps.versions.outputs.ae }}
      agent_version: ${{ steps.versions.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The companion's release check falls back to matching its running build
      # stamp in these notes when an install can't name its own release (#541),
      # so the stamps have to be published, not just remembered.
      - name: Read component version stamps
        id: versions
        run: |
          read_stamp() {
            sed -n "s/^${2}[[:space:]]*=[[:space:]]*\"\(.*\)\"/\1/p" "$1" | head -1
          }
          MGR=$(read_stamp llm-systems-manager/backend/llm-systems-manager.py __version__)
          AE=$(read_stamp llm-systems-alarm-engine/backend/alarm_engine.py __version__)
          AGENT=$(read_stamp agent/llm-systems-agent.py VERSION)
          for v in "$MGR" "$AE" "$AGENT"; do
            [ -n "$v" ] || { echo "::error::could not read a version stamp"; exit 1; }
          done
          {
            echo "manager=$MGR"
            echo "ae=$AE"
            echo "agent=$AGENT"
          } >> "$GITHUB_OUTPUT"
          echo "manager=$MGR ae=$AE agent=$AGENT"

      - name: Build tarball + SHA-256 checksum
        run: |
          ASSET="llm-systems-manager-${TAG}.tar.gz"
          git archive --format=tar.gz \
            --prefix="llm-systems-manager-${TAG}/" \
            -o "$ASSET" HEAD
          sha256sum "$ASSET" | tee "$ASSET.sha256"

      # The installer hard-depends on this layout (top-level prefix dir with
      # tools/installer/ inside) and on the .sha256 verifying — assert both.
      - name: Sanity-check tarball layout + checksum
        run: |
          ASSET="llm-systems-manager-${TAG}.tar.gz"
          tar -tzf "$ASSET" | grep -qx "llm-systems-manager-${TAG}/tools/installer/install.sh"
          tar -tzf "$ASSET" | grep -qx "llm-systems-manager-${TAG}/tools/installer/lib-common.sh"
          sha256sum -c "$ASSET.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-tarball
          path: |
            llm-systems-manager-${{ env.TAG }}.tar.gz
            llm-systems-manager-${{ env.TAG }}.tar.gz.sha256
          if-no-files-found: error

  brew-verify:
    name: brew control-plane e2e (pre-publish)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manager-tarball
          path: dist

      - uses: llmsyscore/homebrew-tap/.github/actions/setup-brew-ci@main
        with:
          tap: llmsyscore/tap

      # Point the tapped manager + alarm-engine formulas at the just-built
      # tarball (file:// + its sha256) so the e2e installs the CANDIDATE build,
      # not the last published release. The agent formula is untouched (its
      # binaries come from a separate workflow — control-plane gate only).
      - name: Repin tapped formulas at the built tarball
        shell: bash
        run: |
          tb="$GITHUB_WORKSPACE/dist/llm-systems-manager-${TAG}.tar.gz"
          test -f "$tb"
          sha="$( { sha256sum "$tb" 2>/dev/null || shasum -a 256 "$tb"; } | awk '{print $1}')"
          tapdir="$(brew --repository llmsyscore/tap)/Formula"
          python3 - "$tapdir" "file://$tb" "$sha" <<'PY'
          import pathlib, re, sys
          tapdir, url, sha = sys.argv[1:4]
          for name in ("llm-systems-manager", "llm-systems-alarm-engine"):
              p = pathlib.Path(tapdir) / f"{name}.rb"
              t = p.read_text()
              t, n1 = re.subn(r'url ".*?"', f'url "{url}"', t, count=1)
              t, n2 = re.subn(r'sha256 ".*?"', f'sha256 "{sha}"', t, count=1)
              assert n1 == 1 and n2 == 1, f"{name}: url/sha256 rewrite failed"
              p.write_text(t)
              print(f"repinned {name} -> {url}")
          PY

      - uses: llmsyscore/homebrew-tap/.github/actions/manager-install-test@main

  # Container gate: build both images from the tag and prove compose up +
  # released-:latest → candidate upgrade. arm64 is covered by the ghcr push.
  compose:
    name: compose gate (pre-publish)
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      skip_arm64: true
    permissions:
      contents: read
      packages: read

  publish:
    name: publish release
    needs: [build, brew-verify, compose]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manager-tarball
          path: .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job — gh must resolve the repo from env, not git.
          GH_REPO: ${{ github.repository }}
          MANAGER_VERSION: ${{ needs.build.outputs.manager_version }}
          AE_VERSION: ${{ needs.build.outputs.ae_version }}
          AGENT_VERSION: ${{ needs.build.outputs.agent_version }}
        run: |
          ASSET="llm-systems-manager-${TAG}.tar.gz"
          cat > /tmp/release-notes.md <<EOF
          Install this release:

          \`\`\`bash
          bash <(curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/tools/installer/install.sh) --ref ${TAG}
          \`\`\`

          The installer verifies \`${ASSET}.sha256\` before deploying anything.

          ### Component versions

          | Component | Version |
          | --- | --- |
          | Manager | \`${MANAGER_VERSION}\` |
          | Alarm engine | \`${AE_VERSION}\` |
          | Agent | \`${AGENT_VERSION}\` |
          EOF
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes-file /tmp/release-notes.md \
            "$ASSET" "$ASSET.sha256"

  packages:
    name: build + attach .deb/.rpm
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install fpm + rpmbuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ruby rpm binutils
          sudo gem install fpm --no-document

      - name: Build packages
        run: tools/packaging/build-packages.sh --version "${GITHUB_REF_NAME#v}" --out dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  docker:
    name: publish ghcr images (multi-arch)
    runs-on: ubuntu-latest
    # After publish: :latest must never point at a tag with no release.
    needs: [brew-verify, publish]
    if: github.event_name == 'push'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One job, two sequential builds: the shared base stage is built once and
      # reused from the local buildx + gha cache instead of per-matrix-leg.
      - name: Build + push manager image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            RELEASE_TAG=${{ env.TAG }}
          file: docker/Dockerfile
          target: manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/manager:latest
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release

      - name: Build + push alarm-engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            RELEASE_TAG=${{ env.TAG }}
          file: docker/Dockerfile
          target: alarm-engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/alarm-engine:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/alarm-engine:latest
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release
