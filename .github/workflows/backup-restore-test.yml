name: Backup + restore tests

# End-to-end backup and restore against real installs (#856). Each job installs
# from the PR tree on a systemd runner, then ci-backup-restore-smoke.sh seeds
# state on the manager + alarm engine, runs a scheduled-backup cycle, destroys
# the seeded state, restores both components from the archives and asserts the
# state is back and the system is operational.
# - colocated: mode 1 (manager + AE + InfluxDB + local agent), encrypted archives.
# - split: mode 4 AE + mode 3 manager in separate trees on one runner (the
#   split-install wiring from install-test.yml), plaintext archives.
#
# Heavy (~15 min/job): gated to backup/restore code paths; workflow_dispatch for
# anything else, nightly for drift.

on:
  pull_request:
    branches: [main]
    paths:
      - "llm-systems-manager/backend/llm-systems-manager.py"
      - "llm-systems-manager/backend/_archive.py"
      - "llm-systems-manager/backend/manager_users.py"
      - "llm-systems-alarm-engine/backend/alarm_engine.py"
      - "llm-systems-alarm-engine/backend/_archive.py"
      - "llm-systems-alarm-engine/backend/api/auth.py"
      - "tools/installer/ci-backup-restore-smoke.sh"
      - "tools/installer/ci-split-smoke.sh"
      - ".github/workflows/backup-restore-test.yml"
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: backup-restore-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  colocated:
    name: co-located (mode 1, encrypted)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the RELEASE stamp

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq rsync wget gnupg ca-certificates openssl sqlite3 \
            python3-venv python3-pip python3-dev build-essential

      # Mode 1 generates the shared ingest + management tokens live, so the
      # scheduler covers the alarm engine with no manual wiring.
      - name: Run installer (mode 1)
        run: sudo bash tools/installer/install.sh --mode 1 --no-self-update < /dev/null

      - name: Smoke test
        run: sudo bash tools/installer/ci-smoke.sh

      - name: Backup, destroy, restore, verify (encrypted archives)
        run: sudo PASSPHRASE=ci-restore-passphrase-2026 bash tools/installer/ci-backup-restore-smoke.sh

      - name: Smoke test (post-restore)
        run: sudo bash tools/installer/ci-smoke.sh

      - name: Collect service logs on failure
        if: failure()
        run: |
          for u in influxdb llm-systems-alarm-engine llm-systems-manager llm-systems-agent; do
            echo "════ journalctl -u $u ════"
            sudo journalctl -u "$u" -n 200 --no-pager || true
          done

  split:
    name: split (modes 3 + 4, plaintext)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the RELEASE stamp

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            jq rsync wget gnupg ca-certificates openssl sqlite3 \
            python3-venv python3-pip python3-dev build-essential

      # Both installs must resolve to the SAME address so their auto-wired URLs,
      # CORS lists, and the AE cert SAN all agree. Reject an empty/link-local IP.
      - name: Pick the shared runner IP
        run: |
          ip="$(hostname -I | awk '{print $1}')"
          case "${ip:-}" in
            ""|169.254.*) echo "no routable runner IP: '${ip:-}'"; exit 1 ;;
          esac
          echo "DETECTED_IP=$ip" >> "$GITHUB_ENV"
          echo "shared runner IP: $ip"

      - name: Install alarm engine (mode 4)
        run: sudo LLMSYS_INSTALL_DIR=/opt/llm-systems-manager-ae bash tools/installer/install.sh --mode 4 --no-self-update < /dev/null

      - name: Install manager (mode 3)
        run: sudo LLMSYS_INSTALL_DIR=/opt/llm-systems-manager-mgr bash tools/installer/install.sh --mode 3 --no-self-update < /dev/null

      # The operator's manual split steps: TLS cert to the AE, tokens activated
      # on the AE and pasted into the manager. Leaves the scheduler covering the AE.
      - name: Wire the two hosts
        run: |
          sudo AE_DIR=/opt/llm-systems-manager-ae \
               MGR_DIR=/opt/llm-systems-manager-mgr \
               DETECTED_IP="$DETECTED_IP" \
               bash tools/installer/ci-split-smoke.sh

      # Admin HTTP calls stay on loopback (always in admin_cidrs); the AE is
      # probed on the LAN IP its cert covers, the same URL the manager dials.
      - name: Backup, destroy, restore, verify (plaintext archives)
        run: |
          sudo MGR_DIR=/opt/llm-systems-manager-mgr \
               AE_DIR=/opt/llm-systems-manager-ae \
               MGR_URL=http://127.0.0.1:5000 \
               AE_URL="https://$DETECTED_IP:8081" \
               bash tools/installer/ci-backup-restore-smoke.sh

      - name: Collect service logs on failure
        if: failure()
        run: |
          for u in llm-systems-alarm-engine llm-systems-manager; do
            echo "════ journalctl -u $u ════"
            sudo journalctl -u "$u" -n 200 --no-pager || true
          done
