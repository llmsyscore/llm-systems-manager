name: Bug report
description: Something is broken or not working as expected.
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The details below help us find the problem quickly.
        Found a security problem? Please don't post it here. Use the private security report link on the previous page.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem. Include the tab and button names where you can.
      placeholder: |
        1. Open the Dashboard tab
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Dashboard / manager
        - Agent
        - Alarm engine
        - Install, update or uninstall
        - Docker
        - Homebrew
        - .deb / .rpm packages
        - Not sure
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Agent: shown next to each agent on the Admin tab.
        Manager and alarm engine: open `/health` on each one (for example `http://your-manager:5000/health`) and copy the `version` value.
      placeholder: |
        Manager: v2026.10.17-1
        Alarm engine: v2026.10.17-1
        Agent: v2026.10.17-1
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Install script
        - .deb package
        - .rpm package
        - Docker Compose
        - Homebrew
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: For the machine with the problem.
      placeholder: Ubuntu 24.04, Debian 13, Rocky Linux 10, macOS 15 ...
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Inference engine
      description: The model server on the affected machine, if any.
      options:
        - llama.cpp
        - LM Studio
        - vLLM
        - No inference engine
        - Other
    validations:
      required: true

  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      options:
        - NVIDIA (CUDA)
        - AMD (ROCm)
        - AMD (Vulkan)
        - Apple Silicon (Metal)
        - Intel
        - CPU only
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the last lines of the log for the affected part, for example:
        `sudo journalctl -u llm-systems-manager -n 200 --no-pager`
        `sudo journalctl -u llm-systems-alarm-engine -n 200 --no-pager`
        `sudo journalctl -u llm-systems-agent -n 200 --no-pager`
        Docker: `docker compose logs --tail 200`
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, browser (for dashboard problems), or anything else that helps.

  - type: checkboxes
    id: redaction
    attributes:
      label: Before you submit
      options:
        - label: I removed passwords, tokens and IP addresses from everything above.
          required: true
